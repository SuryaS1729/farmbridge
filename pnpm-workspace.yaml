packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/ui@57.0.24'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-router@57.0.27
  - expo@57.0.29
onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
# react-native-worklets' Babel plugin requires these without declaring them,
# so pnpm resolved the hoisted Babel 8 copies (from eslint-config) and Metro
# bundling crashed. Pin them to Babel 7 to match @babel/core.
packageExtensions:
  react-native-worklets:
    dependencies:
      "@babel/generator": ^7.28.0
      "@babel/traverse": ^7.28.0
